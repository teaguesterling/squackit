[project]
name = "squackit"
version = "0.9.0"
description = "Semi-QUalified Agent Companion Kit — the stateful intelligence + MCP server layer for fledgling-equipped agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Teague Sterling" },
]
keywords = ["mcp", "ai-agents", "code-intelligence", "fledgling", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # Upper bounds relaxed to <1.0. The tight `<0.13` on fledgling-mcp excluded
    # 0.13.1, which is where fledgling relaxed its own `duckdb==1.5.2` exact pin
    # to a range. Anything needing a specific DuckDB (e.g. matching a bundled
    # extension set) then conflicted, and pip resolved it by SILENTLY
    # BACKTRACKING to squackit 0.7.0 rather than failing — reporting success
    # while installing code two releases old.
    "ast-pluckit>=0.15,<1.0",
    "fledgling-mcp>=0.12,<1.0",
    "click>=8.0",
    "fastmcp>=3.0",
]

[project.scripts]
squackit = "squackit.cli:cli"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-exclude>=1.0",
    "pymdown-extensions>=10.9",
]

[project.urls]
Homepage = "https://github.com/teaguesterling/squackit"
Documentation = "https://squackit.readthedocs.io"
Repository = "https://github.com/teaguesterling/squackit"
Issues = "https://github.com/teaguesterling/squackit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["squackit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
test = [
    "pytest>=7.0",
]
